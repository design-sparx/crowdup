name: End-to-end

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      # Applies migrations and loads supabase/seed.sql.
      - name: Reset database with seed data
        run: supabase db reset

      # The server reads these at runtime; expose the local Supabase keys to later steps.
      - name: Export local Supabase keys
        run: |
          STATUS=$(supabase status -o env)
          value() { echo "$STATUS" | grep "^$1=" | cut -d= -f2- | tr -d '"'; }
          {
            echo "SUPABASE_URL=$(value API_URL)"
            echo "SUPABASE_ANON_KEY=$(value ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(value SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
